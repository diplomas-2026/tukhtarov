spring.application.name=tukhtarov-api
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tukhtarov}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tukhtarov}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tukhtarov}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
